<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b91e8"/>
      <stop offset="100%" stop-color="#5b50b8"/>
    </linearGradient>
    <linearGradient id="tag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd8ff"/>
    </linearGradient>
    <linearGradient id="arc-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12b8ff"/>
      <stop offset="100%" stop-color="#a78bff"/>
    </linearGradient>
    <radialGradient id="hl" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#hl)"/>

  <!-- Price tag diamond -->
  <g transform="translate(512,490) rotate(-45)">
    <rect x="-175" y="-175" width="350" height="350" rx="52" ry="52" fill="url(#tag-grad)" opacity="0.97"/>
    <circle cx="-100" cy="-100" r="42" fill="url(#bg)"/>
    <circle cx="-100" cy="-100" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  </g>

  <!-- Dollar sign -->
  <text
    x="540" y="508"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="168"
    font-weight="700"
    fill="#7f74d8"
  >$</text>

  <!-- Glow arc -->
  <g filter="url(#soft-glow)">
    <path d="M 310 730 Q 512 580 714 680" fill="none" stroke="url(#arc-grad)" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Crisp arc -->
  <path d="M 310 730 Q 512 580 714 680" fill="none" stroke="url(#arc-grad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Arc end dots -->
  <circle cx="714" cy="680" r="22" fill="#12b8ff" opacity="0.95"/>
  <circle cx="310" cy="730" r="16" fill="#a78bff" opacity="0.8"/>

  <!-- Sparkle dots -->
  <circle cx="780" cy="200" r="10" fill="white" opacity="0.35"/>
  <circle cx="820" cy="260" r="6"  fill="white" opacity="0.2"/>
  <circle cx="730" cy="240" r="5"  fill="white" opacity="0.18"/>
</svg>
