<script>
const PRODUCTS=[
  {id:'CXM',name:'Customer Experience Mgmt',poc:142.5,driver:'Locations × touchpoints',
   tiers:[
     {name:'Starter',pop:false,desc:'1–5 locations\n25 touchpoints\n1 survey flow\nBasic dashboard',mult:1},

   ],
   addons:[

     {name:'Sensor / survey update',uc:47.5},
     {name:'CX portal update',uc:28.75},
     {name:'Alert receiver update',uc:11.25},
     {name:'User add / remove',uc:2.5}
   ]},
  {id:'CCM',name:'Customer Complaints Mgmt',poc:207.5,driver:'Locations × touchpoints + escalation workflows',
   tiers:[
     {name:'Starter',pop:false,desc:'1–5 locations\n25 touchpoints\n1 escalation tier\nBasic workflow',mult:1},
     {name:'Growth',pop:true,desc:'6–20 locations\n100 touchpoints\n3 escalation tiers\nSLA tracking',mult:3},
     {name:'Enterprise',pop:false,desc:'21–50 locations\n500 touchpoints\nCustom escalation\nAdvanced SLA',mult:8}
   ],
   addons:[
     {name:'Additional touchpoint / location',uc:47.5},
     {name:'Additional escalation workflow',uc:47.5},
     {name:'Alert receiver update',uc:11.25},
     {name:'Report / dashboard update',uc:28.75}
   ]},
  {id:'ORM',name:'Online Review Management',poc:111.25,driver:'Locations × review channels + competitors',
   tiers:[
     {name:'Starter',pop:false,desc:'1–3 locations\n3 review channels\nNo competitor analysis',mult:1},
     {name:'Growth',pop:true,desc:'4–15 locations\n5 review channels\n2 competitors included',mult:3},
     {name:'Enterprise',pop:false,desc:'16–50 locations\n8 review channels\n5 competitors included',mult:7}
   ],
   addons:[
     {name:'Additional location',uc:11.25},
     {name:'Competitor analysis (per competitor)',uc:23.75},
     {name:'Topic categorisation update',uc:30},
     {name:'Additional review channel',uc:11.25},
     {name:'Weekly / daily report setup',uc:11.25}
   ]},
  {id:'SLT',name:'Social Listening & Tracking',poc:122.5,driver:'Keyword bundles + competitor tracking',
   tiers:[
     {name:'Starter',pop:false,desc:'50 keywords\n2 platforms\nBasic categorisation',mult:1},
     {name:'Growth',pop:true,desc:'200 keywords\n5 platforms\n2 competitors\nStorm alerts',mult:2.5},
     {name:'Enterprise',pop:false,desc:'500+ keywords\nAll platforms\n5+ competitors\nAdvanced alerts',mult:6}
   ],
   addons:[
     {name:'Additional keyword pack (10 keywords)',uc:36.25},
     {name:'Competitor tracking (per competitor)',uc:23.75},
     {name:'Topic categorisation update',uc:30},
     {name:'Keyword storm alert',uc:17.5},
     {name:'Weekly / daily report setup',uc:11.25}
   ]},
  {id:'BPA',name:'Business Process Automation',poc:285,driver:'Workflows × touchpoints / data points',
   tiers:[
     {name:'Starter',pop:false,desc:'1 workflow\n10 data points\nExisting functionality only',mult:1},
     {name:'Growth',pop:true,desc:'3 workflows\n50 data points\nRPA included\nAdvanced automation',mult:3},
     {name:'Enterprise',pop:false,desc:'10 workflows\n200 data points\nCustom dev scope\nFull RPA suite',mult:7}
   ],
   addons:[
     {name:'Additional workflow',uc:285},
     {name:'Additional touchpoint / data point',uc:47.5},
     {name:'RPA configuration',uc:17.5},
     {name:'Report / dashboard update',uc:28.75}
   ]},
  {id:'CSA',name:'Customer Service AI',poc:297.5,driver:'AI agents × channels × KB complexity',
   tiers:[
     {name:'Starter',pop:false,desc:'2 agents\n2 channels\nSmall static KB',mult:1},
     {name:'Growth',pop:true,desc:'4 agents\n4 channels\nMedium KB + dynamic data',mult:3},
     {name:'Enterprise',pop:false,desc:'8+ agents\n6 channels\nLarge KB + external MCP',mult:7}
   ],
   addons:[
     {name:'Additional agent',uc:85},
     {name:'KB expansion per location',uc:85},
     {name:'Additional channel onboarding',uc:85},
     {name:'Report / dashboard update',uc:28.75}
   ]},
  {id:'EMC',name:'Email Marketing Campaign',poc:57.5,driver:'Monthly email volume + domains',
   tiers:[
     {name:'Starter',pop:false,desc:'10k emails / month\n1 domain\nBasic templates',mult:1},
     {name:'Growth',pop:true,desc:'50k emails / month\n3 domains\nAdvanced templates',mult:2.5},
     {name:'Enterprise',pop:false,desc:'200k+ emails / month\nUnlimited domains\nCustom workflows',mult:6}
   ],
   addons:[
     {name:'Email quota upgrade (per 10k)',uc:11.25},
     {name:'Domain whitelisting (per domain)',uc:5},
     {name:'Email / SMS template update',uc:11.25}
   ]},
  {id:'VoA',name:'Voice of Audience',poc:162.5,driver:'Events / year × sessions per event',
   tiers:[
     {name:'Starter',pop:false,desc:'2 events / year\n4 sessions / event\nUp to 200 attendees',mult:1},
     {name:'Growth',pop:true,desc:'6 events / year\n8 sessions / event\nUp to 1,000 attendees',mult:2.5},
     {name:'Enterprise',pop:false,desc:'Unlimited events\nCustom sessions\nUnlimited attendees\nOn-site support',mult:5}
   ],
   addons:[
     {name:'Additional event',uc:162.5},
     {name:'Additional session (per session)',uc:47.5},
     {name:'Custom UI (per event)',uc:162.5}
   ]}
];

// UXI module state: which products are selected and at which tier index
const UXI_MODULES = ['CXM','CCM','ORM','SLT','CSA','BPA','EMC','VoA'];
let uxiState = {};
UXI_MODULES.forEach(id => { uxiState[id] = { active: false, tier: 0 }; });

// Bundle discount tiers
function bundleDiscount(n) {
  if(n>=6) return 0.20;
  if(n>=4) return 0.15;
  if(n>=3) return 0.12;
  if(n>=2) return 0.08;
  return 0;
}

let sel='CXM', mkt=20, impl=6, am=5, cur='USD';
const LKR=305;

function fmt(usd){
  const v=cur==='LKR'?usd*LKR:usd;
  return (cur==='LKR'?'₨':'$')+Math.round(v).toLocaleString();
}
function mrr(poc,mult){return poc*mkt/12*mult;}
function ip(poc){return poc*impl;}
function ap(uc){return uc*am/12;}

function totalUxiImplCost() {
  return UXI_MODULES.reduce((s,id)=>{
    if(!uxiState[id].active) return s;
    const p = PRODUCTS.find(x=>x.id===id);
    return s + p.poc;
  },0);
}

function renderGrid(){
  const implLabel = sel==='UXI' ? '— modular' : '';
  document.getElementById('pgrid').innerHTML = [...PRODUCTS, {id:'UXI',name:'Unified Experience Intelligence',poc:null}].map(p=>`
    <div class="pcard${p.id===sel?' sel':''}" onclick="pick('${p.id}')">
      <div class="pcard-id">${p.id}</div>
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-impl">${p.poc!==null?'Impl: '+fmt(ip(p.poc)):'Bundle — pick modules'}</div>
    </div>`).join('');
}

function renderUxi(){
  const activeIds = UXI_MODULES.filter(id=>uxiState[id].active);
  const n = activeIds.length;
  const disc = bundleDiscount(n);

  let subtotal = 0;
  let implTotal = 0;

  const modulesHtml = UXI_MODULES.map(id=>{
    const p = PRODUCTS.find(x=>x.id===id);
    const st = uxiState[id];
    const tierMrr = st.active ? mrr(p.poc, p.tiers[st.tier].mult) : 0;
    if(st.active){ subtotal += tierMrr; implTotal += p.poc; }
    return `
    <div class="uxi-module${st.active?' active':''}" id="umod-${id}">
      <div class="uxi-module-header" onclick="toggleModule('${id}')">
        <div class="uxi-toggle"><span class="uxi-check">${st.active?'✓':''}</span></div>
        <div class="uxi-mid">
          <div class="uxi-mid-id">${id}</div>
          <div class="uxi-mid-name">${p.name}</div>
          <div class="uxi-mid-driver">${p.driver}</div>
        </div>
        <div class="uxi-price">
          ${st.active?`<div class="uxi-price-main">${fmt(mrr(p.poc,p.tiers[st.tier].mult))}/mo</div><div class="uxi-price-sub">${p.tiers[st.tier].name} tier</div>`:`<div class="uxi-price-sub" style="color:var(--color-text-tertiary)">not included</div>`}
        </div>
      </div>
      ${st.active?`
      <div class="uxi-tiers">
        ${p.tiers.map((t,i)=>`
          <div class="uxi-tier-btn${st.tier===i?' chosen':''}" onclick="setTier('${id}',${i})">
            <div class="uxi-tier-name">${t.name}</div>
            <div class="uxi-tier-price">${fmt(mrr(p.poc,t.mult))}/mo</div>
            <div class="uxi-tier-desc">${t.desc.split('\n').slice(0,3).join('<br>')}</div>
          </div>`).join('')}
      </div>`:''}
    </div>`;
  }).join('');

  const discAmt = subtotal * disc;
  const total = subtotal - discAmt;
  const implFinal = implTotal * impl;

  const discLabel = disc>0 ? `<span class="disc-badge">${Math.round(disc*100)}% bundle discount</span>` : '';

  const sumHtml = n===0 ? `<div style="font-size:13px;color:var(--color-text-secondary);padding:.5rem 0">Select at least one module above to see pricing.</div>` : `
    <div class="uxi-summary">
      <div class="shd" style="margin-top:0">Bundle summary</div>
      ${activeIds.map(id=>{
        const p=PRODUCTS.find(x=>x.id===id);
        return `<div class="uxi-sum-row"><span>${id} — ${p.tiers[uxiState[id].tier].name}</span><span>${fmt(mrr(p.poc,p.tiers[uxiState[id].tier].mult))}/mo</span></div>`;
      }).join('')}
      ${disc>0?`<div class="uxi-sum-row disc"><span>Bundle discount (${n} modules) ${discLabel}</span><span>−${fmt(discAmt)}/mo</span></div>`:''}
      <div class="uxi-sum-row total"><span>Total subscription</span><span>${fmt(total)}/mo &nbsp;·&nbsp; ${fmt(total*12)}/yr</span></div>
      <div class="uxi-sum-row" style="margin-top:6px"><span>One-time implementation</span><span>${fmt(implFinal)}</span></div>
    </div>`;

  document.getElementById('detail').innerHTML = `
    <div class="dh">
      <div>
        <div style="font-size:10px;color:var(--color-text-secondary)">UXI</div>
        <div style="font-size:15px;font-weight:500">Unified Experience Intelligence</div>
        <span class="driver-chip">Pick any combination of modules — each at its own tier</span>
      </div>
      <div style="text-align:right;flex-shrink:0;font-size:11px;color:var(--color-text-secondary)">
        ${n} module${n!==1?'s':''} selected${disc>0?' · '+Math.round(disc*100)+'% discount':''}
      </div>
    </div>
    <div class="shd">Select modules and configure each tier</div>
    <div class="uxi-wrap">${modulesHtml}</div>
    <div style="margin-top:12px">${sumHtml}</div>
    <div class="fn">
      Bundle discounts: 2 modules 8% · 3 modules 12% · 4–5 modules 15% · 6+ modules 20%.
      Each module retains its own tier limits and add-ons. Implementation fee is the sum of selected module setup costs.
    </div>`;
}

function renderStandard(){
  const p=PRODUCTS.find(x=>x.id===sel);
  const tiers=p.tiers.map(t=>`
    <div class="tier${t.pop?' pop':''}">
      ${t.pop?'<div class="tbadge">Most popular</div>':''}
      <div class="tname">${t.name}</div>
      <div class="tprice">${fmt(mrr(p.poc,t.mult))}<span class="tsub">/mo</span></div>
      <div class="tyr">${fmt(mrr(p.poc,t.mult)*12)}/yr</div>
      <div class="tdesc">${t.desc.split('\n').join('<br>')}</div>
    </div>`).join('');
  const addons=p.addons.map(a=>`
    <div class="arow"><span>${a.name}</span><span class="ap">${fmt(ap(a.uc))}/mo</span></div>`).join('');
  document.getElementById('detail').innerHTML=`
    <div class="dh">
      <div>
        <div style="font-size:10px;color:var(--color-text-secondary)">${p.id}</div>
        <div style="font-size:15px;font-weight:500">${p.name}</div>
        <span class="driver-chip">Pricing driver: ${p.driver}</span>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;color:var(--color-text-secondary)">One-time implementation</div>
        <div style="font-size:20px;font-weight:500">${fmt(ip(p.poc))}</div>
        <div style="font-size:11px;color:var(--color-text-secondary)">Internal cost basis: ${fmt(p.poc)}</div>
      </div>
    </div>
    <div class="shd">Subscription tiers — monthly recurring</div>
    <div class="tiers">${tiers}</div>
    <div class="shd">Add-on pricing — per unit per month</div>
    ${addons}
    <div class="fn">Prices at ${mkt}× market multiplier · impl ${parseFloat(impl).toFixed(1)}× · add-ons ${parseFloat(am).toFixed(1)}× annualised. Annual billing discount 10–15% recommended.</div>`;
}

function renderDetail(){ sel==='UXI' ? renderUxi() : renderStandard(); }

function render(){ renderGrid(); renderDetail(); }
function pick(id){ sel=id; render(); }
function toggleModule(id){ uxiState[id].active=!uxiState[id].active; renderDetail(); }
function setTier(id,i){ uxiState[id].tier=i; renderDetail(); }

document.getElementById('mkt').oninput=e=>{mkt=+e.target.value;document.getElementById('mkt-v').textContent=mkt+'×';render();};
document.getElementById('impl').oninput=e=>{impl=+e.target.value;document.getElementById('impl-v').textContent=parseFloat(impl).toFixed(1)+'×';render();};
document.getElementById('addon-m').oninput=e=>{am=+e.target.value;document.getElementById('addon-v').textContent=parseFloat(am).toFixed(1)+'×';render();};
document.getElementById('cur').onchange=e=>{cur=e.target.value;render();};
render();
</script>
